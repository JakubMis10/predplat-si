
<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Registrácia</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center h-screen">
    <h2 class="text-3xl mb-4">Registrácia</h2>
    <form class="bg-white p-6 rounded shadow-md w-80 space-y-4">
        <input type="text" placeholder="Email" class="w-full border p-2 rounded">
        <input type="password" placeholder="Heslo" class="w-full border p-2 rounded">
        <button class="bg-blue-500 text-white px-4 py-2 rounded w-full">Registrovať</button>
    </form>
</body>
</html>
